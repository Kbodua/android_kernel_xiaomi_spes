name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up build env
        run: |
          sudo apt update
          sudo apt install -y git clang llvm lld build-essential bc \
              bison flex libssl-dev libncurses5-dev libelf-dev ccache

      - name: Build kernel
        run: |
          mkdir out
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          make O=out vendor/spes-perf_defconfig
          make -j$(nproc) O=out \
              ARCH=arm64 CC=clang \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
