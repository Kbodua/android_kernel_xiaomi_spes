name: Build Android Kernel (spes-perf)

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 zip curl wget ccache

    - name: Download clang toolchain
      run: |
        mkdir -p ~/toolchains
        cd ~/toolchains
        # Example: Proton Clang 14 (you can replace with your preferred one)
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

    - name: Build kernel
      run: |
        export PATH=~/toolchains/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        mkdir -p out

        echo "==== Building defconfig ===="
        make O=out ARCH=arm64 vendor/spes-perf_defconfig

        echo "==== Building kernel ===="
        make -j$(nproc) O=out ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-out
        path: out/arch/arm64/boot/Image.gz-dtb
