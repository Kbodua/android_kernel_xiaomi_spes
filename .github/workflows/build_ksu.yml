name: Build Spes Kernel with KernelSU

on:
  workflow_dispatch:  # allows you to manually trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KERNEL_REPO: https://github.com/UnrulyBoss/android_kernel_xiaomi_spes.git
      CLANG_REPO: https://github.com/kdrag0n/proton-clang.git
      CLANG_PATH: ${{ github.workspace }}/proton-clang

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex make clang lld llvm zip curl

      - name: Clone Proton Clang Toolchain
        run: |
          echo "🔧 Cloning Proton Clang toolchain..."
          git clone --depth=1 ${{ env.CLANG_REPO }} ${{ env.CLANG_PATH }}

      - name: Setup Build Environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ env.CLANG_PATH }}/bin:$PATH
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub
          echo "✅ Build environment configured."

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=${{ env.CLANG_PATH }}/bin:$PATH
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub

          echo "🏗️ Starting kernel build..."
          mkdir -p out

          # Use your defconfig
          make O=out ARCH=arm64 spes-perf_defconfig

          # Compile kernel
          make O=out ARCH=arm64 CC=clang -j$(nproc)

          echo "✅ Kernel build completed successfully."

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Spes-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb
