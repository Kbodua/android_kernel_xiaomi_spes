name: Build Spes Kernel with KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-22.04   # ✅ Use Ubuntu 22.04 for clang compatibility

    env:
      KERNEL_REPO: https://github.com/Kbodua/android_kernel_xiaomi_spes.git
      CLANG_REPO: https://github.com/kdrag0n/proton-clang.git
      CLANG_DIR: proton-clang

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential flex git clang lld llvm zip wget curl \
            libncurses-dev libssl-dev ccache python3

      - name: Clone Proton Clang
        run: |
          echo "🔽 Cloning Proton Clang..."
          git clone --depth=1 ${{ env.CLANG_REPO }} ${{ env.CLANG_DIR }}

      - name: Set Up Build Environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/${{ env.CLANG_DIR }}/bin:$PATH
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub
          echo "✅ Environment setup complete."

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$PWD/${{ env.CLANG_DIR }}/bin:$PATH
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub

          echo "🏗️ Starting kernel build..."
          make O=out ARCH=arm64 spes-perf_deconfig
          make O=out ARCH=arm64 CC=clang LD=ld.lld -j$(nproc)

      - name: Upload Compiled Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Spes-Kernel-Reze
          path: out/arch/arm64/boot/Image.gz-dtb
