name: Build Spes Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex git clang lld llvm make zip curl

      - name: Set up Build Environment
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub
          echo "Environment setup complete ✅"

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=UnrulyBoss
          export KBUILD_BUILD_HOST=GitHub
          export CC=clang

          echo "🏗️ Starting kernel build..."
          mkdir -p out

          # Use the defconfig you mentioned earlier
          make O=out ARCH=arm64 spes-perf_defconfig

          # Compile kernel using system Clang
          make O=out ARCH=arm64 CC=clang -j$(nproc)

      - name: Upload Compiled Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spes-Kernel-ARM64
          path: out/arch/arm64/boot/Image.gz-dtb
